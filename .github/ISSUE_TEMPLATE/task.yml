name: Task SATU
description: Task implementasi, UX, quality, documentation, governance, atau infrastructure.
title: '[Area] '
body:
  - type: markdown
    attributes:
      value: |
        Gunakan bahasa Indonesia untuk product context. Technical term English diperbolehkan. Jangan menghapus section wajib.
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Jelaskan problem, current state, actor, dan alasan task diperlukan.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected Outcome
      description: Jelaskan inspectable outcome, bukan daftar aktivitas.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: Gunakan checklist yang observable dan verifiable.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Sebutkan pemeriksaan dan bukti yang sesuai dengan perubahan.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of Scope
      description: Nyatakan pekerjaan yang sengaja tidak dilakukan oleh issue ini.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and Handoff
      description: Cantumkan blocker yang belum selesai dan handoff berikutnya.
      placeholder: |
        - Blocked by: #... atau N/A
        - Handoff: ...
    validations:
      required: true
  - type: textarea
    id: library
    attributes:
      label: Library/Package
      description: Sebut package, install command, alasan, compatibility, dan license check. Jika tidak perlu, jelaskan framework-native baseline.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Tautkan dokumen pemilik, termasuk sumber UX terkait jika issue menyentuh UI.
      placeholder: |
        - [PRD](https://github.com/Alfian57/satu-platform/blob/main/docs/product/PRD.md)
    validations:
      required: true
  - type: textarea
    id: frontend_loading
    attributes:
      label: Frontend Loading Contract
      description: Wajib untuk issue frontend/fullstack/UX. Gunakan checklist ini atau sesuaikan dengan surface. Tulis N/A jika issue tidak menyentuh frontend.
      value: |
        - [ ] Gunakan existing `Skeleton` untuk initial, deferred, refresh, dan pagination loading pada region yang relevan.
        - [ ] Pertahankan geometry, spacing, focus order, row count realistis, dan hindari layout shift atau horizontal overflow.
        - [ ] Region loading memiliki `aria-busy="true"` dan satu `role="status"` atau `aria-live="polite"` announcement.
        - [ ] Content, heading, filter, dan primary action tetap terlihat ketika hanya sebagian region loading.
        - [ ] Processing action memakai inline progress atau `Spinner`, bukan mengganti seluruh content dengan skeleton.
        - [ ] Bedakan empty, error, forbidden, stale, partial-data, dan retry dari loading.
        - [ ] Reduced motion tidak menghilangkan status atau recovery.
        - [ ] Sertakan browser evidence untuk skeleton dan transition ke state berikutnya.
        - [ ] Referensi: `docs/ux/LOADING_STATES.md`.
    validations:
      required: true
  - type: textarea
    id: metadata
    attributes:
      label: Metadata
      description: Milestone, legacy phase, owner/support role, priority, size, gate, dan risk.
      placeholder: |
        - Milestone: M...
        - Legacy phase: N/A
        - Owner role: ...
        - Supporting roles: ...
        - Priority: P...
        - Size: S/M/L
        - Gate: none/human/external/conditional
        - Risk: low/medium/high
    validations:
      required: true

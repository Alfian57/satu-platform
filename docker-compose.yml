services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: satu_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
      - APP_KEY=base64:c3VwZXJzZWNyZXRrZXl0aGF0c2hvdWxkYmVjaGFuZ2Vk
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=satu
      - DB_USERNAME=satu
      - DB_PASSWORD=secret
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - satu_network

  web:
    image: nginx:alpine
    container_name: satu_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - satu_network

  db:
    image: mysql:8.0
    container_name: satu_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=satu
      - MYSQL_USER=satu
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root
    ports:
      - "3306:3306"
    volumes:
      - satu_db_data:/var/lib/mysql
    networks:
      - satu_network

networks:
  satu_network:
    driver: bridge

volumes:
  satu_db_data:
